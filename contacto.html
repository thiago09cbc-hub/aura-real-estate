<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacto — Aura Real Estate</title>
<link rel="icon" href="img/logo.png">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="contacto.css">
</head>
<body data-page="contacto">

<header id="site-header"></header>

<main class="section container contacto-layout">
  <div class="contacto-info">
    <h1 class="section-title">Hablemos</h1>
    <p class="section-sub">Escribinos por cualquier consulta sobre compra, alquiler o emprendimientos. Te respondemos a la brevedad.</p>
    <div class="info-list">
      <div class="info-item"><b>Dirección</b><span>Av. del Libertador 5900, CABA</span></div>
      <div class="info-item"><b>Teléfono</b><span>+54 11 6011-0000</span></div>
      <div class="info-item"><b>Correo</b><span>hola@aurarealestate.com</span></div>
      <div class="info-item"><b>Horario</b><span>Lun a Vie de 9 a 18 h</span></div>
    </div>
  </div>

  <form id="contacto-form" class="panel contacto-form">
    <div class="form-field">
      <label for="c-nombre">Nombre</label>
      <input type="text" id="c-nombre" placeholder="Tu nombre">
    </div>
    <div class="form-field">
      <label for="c-email">Correo electrónico</label>
      <input type="email" id="c-email" placeholder="tu@correo.com">
    </div>
    <div class="form-field">
      <label for="c-mensaje">Mensaje</label>
      <textarea id="c-mensaje" rows="5" placeholder="Contanos qué estás buscando..."></textarea>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Enviar mensaje</button>
  </form>
</main>

<footer id="site-footer"></footer>

<script src="js/app.js"></script>
</body>
</html>
