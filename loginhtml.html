<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — Aura Real Estate</title>
<link rel="icon" href="img/logo.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body data-page="login">

<header id="site-header"></header>

<main class="auth-wrap">
  <div class="auth-card">
    <div class="auth-avatar">
      <img src="img/logo.png" alt="Aura">
    </div>
    <h1 class="auth-title">Iniciar sesión</h1>
    <p class="auth-sub">Entrá con tu cuenta para comprar, alquilar y agendar visitas.</p>

    <form id="login-form">
      <div class="form-field">
        <label for="l-email">Correo electrónico</label>
        <input type="email" id="l-email" placeholder="tu@correo.com" autocomplete="username">
        <span class="error-msg">Ingresá un correo válido.</span>
      </div>
      <div class="form-field">
        <label for="l-password">Contraseña</label>
        <input type="password" id="l-password" placeholder="Tu contraseña" autocomplete="current-password">
        <span class="error-msg">Ingresá tu contraseña.</span>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Iniciar sesión</button>
    </form>

    <p class="auth-error" id="login-error" hidden>Correo o contraseña incorrectos.</p>
    <p class="auth-foot">¿No tenés cuenta? <a href="registro.html" class="gold">Registrate</a></p>
  </div>
</main>

<footer id="site-footer"></footer>

<script src="js/app.js"></script>
</body>
</html>
