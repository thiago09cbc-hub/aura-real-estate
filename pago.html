<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pago — Aura Real Estate</title>
<link rel="icon" href="img/logo.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/pago.css">
</head>
<body data-page="pago">

<header id="site-header"></header>

<main class="section container pago-layout">
  <!-- Columna izquierda: resumen + detalle de la propiedad -->
  <div class="pago-side">
    <!-- Resumen de la operación (foto y nombre) -->
    <aside class="panel resumen-card" id="resumen-compra"></aside>

    <!-- Detalle de la propiedad -->
    <section class="panel detalle-card" id="detalle-propiedad" aria-label="Detalle de la propiedad"></section>
  </div>

  <!-- Formulario de pago -->
  <div class="pago-content">
    <div id="pago-form-wrap">
      <h1 class="section-title">Completar el pago</h1>
      <p class="section-sub">Los datos de la tarjeta son simulados: no se realiza ningún cargo real.</p>

      <form id="pago-form" class="panel">
        <div class="form-field">
          <label for="pago-nombre">Nombre en la tarjeta</label>
          <input type="text" id="pago-nombre" placeholder="Como figura en la tarjeta" required>
        </div>
        <div class="form-field">
          <label for="pago-numero">Número de tarjeta</label>
          <input type="text" id="pago-numero" placeholder="0000 0000 0000 0000" required maxlength="19">
        </div>
        <div class="form-row">
          <div class="form-field">
            <label for="pago-vencimiento">Vencimiento</label>
            <input type="text" id="pago-vencimiento" placeholder="MM/AA" required maxlength="5">
          </div>
          <div class="form-field">
            <label for="pago-cvv">CVV</label>
            <input type="text" id="pago-cvv" placeholder="123" required maxlength="4">
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btn-pagar">Pagar ahora</button>
      </form>
    </div>

    <!-- Estado: PAGO NO PROCESADO (igual al mock) -->
    <div id="pago-fallido" class="panel pago-fallido hidden">
      <h1 class="fallido-title">PAGO NO PROCESADO</h1>
      <div class="fallido-opciones">
        <button type="button" id="btn-reintentar" class="fallido-opcion">Intentar nuevamente</button>
        <button type="button" id="btn-otra-tarjeta" class="fallido-opcion">Usar otra tarjeta</button>
        <button type="button" id="btn-transferencia" class="fallido-opcion">Pagar mediante transferencia</button>
      </div>
      <p class="fallido-nota">Esta propiedad tiene alta demanda. Podés reservarla durante 24 horas con una seña menor.</p>
      <div class="fallido-cta">
        <button type="button" id="btn-reservar-ahora" class="btn btn-primary btn-block">RESERVAR AHORA</button>
        <button type="button" id="btn-ahora-no" class="btn btn-ghost btn-block">AHORA NO</button>
      </div>
    </div>
  </div>
</main>

<footer id="site-footer"></footer>

<script>
/* Detalle de la propiedad — datos de ejemplo: editá los valores de cada id */
(function () {
  var DETALLES = {
    1: { precio: '€12.300.500', expensas: '€1.850 / mes', totales: 350, cubiertos: 310, ambientes: 6, banos: 4, toilet: 1, cocheras: 2, dormitorios: 4, antiguedad: 5 },
    2: { precio: '€7.860.850',  expensas: '€2.400 / mes', totales: 500, cubiertos: 420, ambientes: 7, banos: 5, toilet: 2, cocheras: 3, dormitorios: 4, antiguedad: 3 }
  };
  var ICONOS = {
    totales:   '<rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="M8 16l8-8M11 8h5v5"/>',
    cubiertos: '<path d="M4 11l8-7 8 7v9H4z"/><path d="M9 16l6-6M11 10h4v4"/>',
    ambientes: '<rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="M12 3.5v6M3.5 12h6M14 12h6.5M12 14v6.5"/>',
    banos:     '<path d="M3 12h18v2a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5z"/><path d="M6 12V6a2 2 0 0 1 4 0"/><path d="M7 19l-1 2M17 19l1 2"/>',
    toilet:    '<path d="M8 3h5v7"/><path d="M5 10h14v3a6 6 0 0 1-6 6h-2a6 6 0 0 1-6-6z"/><path d="M9 19v2M15 19v2"/>',
    cochera:   '<path d="M3 11l9-7 9 7v9H3z"/><path d="M7 20v-5h10v5M7 17h10"/>',
    dormitorio:'<path d="M3 18v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6"/><path d="M3 15h18M7 10V7h10v3"/>',
    antig:     '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/>'
  };
  function plural(n, s, p) { return n === 1 ? s : p; }
  function item(icono, n, texto) {
    return '<li><svg viewBox="0 0 24 24" aria-hidden="true">' + ICONOS[icono] + '</svg><span><b>' + n + '</b> ' + texto + '</span></li>';
  }

  var id = parseInt(new URLSearchParams(location.search).get('id'), 10) || 1;
  var d = DETALLES[id] || DETALLES[1];
  var box = document.getElementById('detalle-propiedad');
  if (!box) return;

  box.innerHTML =
    '<span class="detalle-tag">Venta</span>' +
    '<p class="detalle-precio">' + d.precio + '</p>' +
    '<p class="detalle-expensas">Expensas : ' + d.expensas + '</p>' +
    '<ul class="detalle-grid">' +
      item('totales', d.totales, 'm² totales') +
      item('cubiertos', d.cubiertos, 'm² cubiertos') +
      item('ambientes', d.ambientes, 'ambientes') +
      item('banos', d.banos, plural(d.banos, 'baño', 'baños')) +
      item('toilet', d.toilet, plural(d.toilet, 'toilet', 'toilets')) +
      item('cochera', d.cocheras, plural(d.cocheras, 'cochera', 'cocheras')) +
      item('dormitorio', d.dormitorios, plural(d.dormitorios, 'dormitorio', 'dormitorios')) +
      item('antig', d.antiguedad, plural(d.antiguedad, 'año antigüedad', 'años antigüedad')) +
    '</ul>';
})();
</script>

<script src="js/app.js"></script>
</body>
</html>
