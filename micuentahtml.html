<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi cuenta — Aura Real Estate</title>
<link rel="icon" href="img/logo.png">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="mi-cuenta.css">
</head>
<body data-page="miCuenta">

<header id="site-header"></header>

<main class="section container">
  <h1 class="section-title">Mi cuenta</h1>

  <div class="cuenta-layout">
    <!-- Perfil -->
    <div class="panel perfil-card">
      <h3>Datos personales</h3>
      <div class="perfil-dato"><span>Nombre</span><b id="mc-nombre"></b></div>
      <div class="perfil-dato"><span>Correo</span><b id="mc-email"></b></div>
      <div class="perfil-dato"><span>DNI</span><b id="mc-dni"></b></div>
      <div class="perfil-dato"><span>Teléfono</span><b id="mc-tel"></b></div>
      <div class="perfil-dato"><span>Tipo de cliente</span><b id="mc-tipo"></b></div>
      <a href="agendar-cita.html" class="btn btn-outline btn-block" style="margin-top:16px;">Agendar nueva visita</a>
    </div>

    <!-- Operaciones -->
    <div class="cuenta-main">
      <section class="panel cuenta-section">
        <h3>Mis compras</h3>
        <div id="mc-ventas"></div>
      </section>

      <section class="panel cuenta-section">
        <h3>Mis alquileres y pagos</h3>
        <div id="mc-alquileres"></div>
      </section>

      <section class="panel cuenta-section">
        <h3>Mis visitas agendadas</h3>
        <div id="mc-citas"></div>
      </section>
    </div>
  </div>
</main>

<footer id="site-footer"></footer>

<script src="js/app.js"></script>
</body>
</html>
