<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — Aura Real Estate</title>
<link rel="icon" href="img/logo.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body data-page="login">

<header id="site-header"></header>

<main class="auth-wrap">
  <div class="auth-card panel">
    <div class="auth-avatar">
      <img src="img/avatar.png" alt="" onerror="this.style.display='none'">
    </div>
    <h1 class="auth-title">Iniciar sesión</h1>
    <p class="auth-sub">Accedé para gestionar tus compras, alquileres y visitas.</p>

    <p id="login-error" class="auth-error hidden"></p>

    <form id="login-form">
      <div class="form-field">
        <label for="login-email">Correo</label>
        <input type="email" id="login-email" required placeholder="tu@correo.com">
      </div>
      <div class="form-field">
        <label for="login-password">Contraseña</label>
        <input type="password" id="login-password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Iniciar sesión</button>
    </form>

    <a href="#" class="auth-link">¿Olvidaste tu contraseña?</a>

    <div class="auth-demo">
      <span>¿Querés probar sin registrarte?</span>
      <button type="button" id="btn-demo" class="btn btn-ghost btn-sm btn-block">Usar cuenta demo (demo@aura.com)</button>
    </div>

    <p class="auth-foot">¿No tenés cuenta? <a href="registro.html" class="gold">Registrate acá</a></p>
  </div>
</main>

<footer id="site-footer"></footer>

<script src="js/app.js"></script>
</body>
</html>
